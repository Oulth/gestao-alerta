<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--text-body);background:#fff}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{width:88px}.sw div{height:60px;border-radius:8px;border:1px solid rgba(0,0,0,.06)}.sw b{display:block;font:600 12px var(--font-sans);margin-top:6px;color:var(--ink-900)}.sw span{font:400 11px ui-monospace,monospace;color:var(--gray-500)}.lbl{font:400 11px ui-monospace,monospace;color:var(--gray-500)}</style></head><body><div class="row"><div class="sw"><div style="background:var(--success)"></div><b>Success</b><span>--success</span></div><div class="sw"><div style="background:var(--warning)"></div><b>Warning</b><span>--warning</span></div><div class="sw"><div style="background:var(--success-soft)"></div><b>Success soft</b><span>--success-soft</span></div><div class="sw"><div style="background:var(--warning-soft)"></div><b>Warning soft</b><span>--warning-soft</span></div><div class="sw"><div style="background:var(--danger)"></div><b>Danger</b><span>--danger</span></div><div class="sw"><div style="background:var(--info)"></div><b>Info</b><span>--info</span></div></div></body></html>
