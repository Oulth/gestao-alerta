<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--text-body);background:#fff}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{width:88px}.sw div{height:60px;border-radius:8px;border:1px solid rgba(0,0,0,.06)}.sw b{display:block;font:600 12px var(--font-sans);margin-top:6px;color:var(--ink-900)}.sw span{font:400 11px ui-monospace,monospace;color:var(--gray-500)}.lbl{font:400 11px ui-monospace,monospace;color:var(--gray-500)}</style></head><body><div class="row"><div style="flex:1;height:130px;border-radius:14px;background:var(--grain),var(--grad-forest);background-blend-mode:overlay,normal;position:relative;overflow:hidden;padding:12px;box-sizing:border-box;color:#fff;font:600 13px var(--font-sans)"><div style="position:absolute;width:220px;height:220px;border:1px solid rgba(166,216,90,.45);border-radius:50%;right:-120px;top:-60px"></div>Forest + grain</div><div style="flex:1;height:130px;border-radius:14px;background:var(--grain),var(--grad-teal);background-blend-mode:overlay,normal;position:relative;overflow:hidden;padding:12px;box-sizing:border-box;color:#fff;font:600 13px var(--font-sans)"><div style="position:absolute;width:220px;height:220px;border:1px solid rgba(166,216,90,.45);border-radius:50%;right:-120px;top:-60px"></div>Teal glow</div><div style="flex:1;height:130px;border-radius:14px;background:var(--grain),var(--grad-leaf);background-blend-mode:overlay,normal;position:relative;overflow:hidden;padding:12px;box-sizing:border-box;color:#fff;font:600 13px var(--font-sans)"><div style="position:absolute;width:220px;height:220px;border:1px solid rgba(166,216,90,.45);border-radius:50%;right:-120px;top:-60px"></div>Leaf</div></div></body></html>
