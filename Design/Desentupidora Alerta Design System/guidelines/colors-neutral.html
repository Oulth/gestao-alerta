<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--text-body);background:#fff}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{width:88px}.sw div{height:60px;border-radius:8px;border:1px solid rgba(0,0,0,.06)}.sw b{display:block;font:600 12px var(--font-sans);margin-top:6px;color:var(--ink-900)}.sw span{font:400 11px ui-monospace,monospace;color:var(--gray-500)}.lbl{font:400 11px ui-monospace,monospace;color:var(--gray-500)}</style></head><body><div class="row"><div class="sw"><div style="background:var(--white)"></div><b>White</b><span>--white</span></div><div class="sw"><div style="background:var(--gray-50)"></div><b>Gray 50</b><span>--gray-50</span></div><div class="sw"><div style="background:var(--gray-100)"></div><b>Gray 100</b><span>--gray-100</span></div><div class="sw"><div style="background:var(--gray-200)"></div><b>Gray 200</b><span>--gray-200</span></div><div class="sw"><div style="background:var(--gray-300)"></div><b>Gray 300</b><span>--gray-300</span></div><div class="sw"><div style="background:var(--gray-500)"></div><b>Gray 500</b><span>--gray-500</span></div><div class="sw"><div style="background:var(--gray-700)"></div><b>Gray 700</b><span>--gray-700</span></div><div class="sw"><div style="background:var(--ink-900)"></div><b>Ink 900</b><span>--ink-900</span></div></div></body></html>
