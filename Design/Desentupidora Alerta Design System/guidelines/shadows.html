<!-- @dsCard group="Spacing" viewport="700x150" name="Shadows" subtitle="sm · md · lg · cta (glow verde)" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--text-body);background:#fff}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{width:88px}.sw div{height:60px;border-radius:8px;border:1px solid rgba(0,0,0,.06)}.sw b{display:block;font:600 12px var(--font-sans);margin-top:6px;color:var(--ink-900)}.sw span{font:400 11px ui-monospace,monospace;color:var(--gray-500)}.lbl{font:400 11px ui-monospace,monospace;color:var(--gray-500)}</style></head><body><div class="row" style="gap:24px;padding:8px"><div style="text-align:center"><div style="width:120px;height:68px;background:#fff;border-radius:14px;box-shadow:var(--shadow-sm);border:1px solid var(--gray-100)"></div><div class="lbl" style="margin-top:8px">--shadow-sm</div></div><div style="text-align:center"><div style="width:120px;height:68px;background:#fff;border-radius:14px;box-shadow:var(--shadow-md);border:1px solid var(--gray-100)"></div><div class="lbl" style="margin-top:8px">--shadow-md</div></div><div style="text-align:center"><div style="width:120px;height:68px;background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);border:1px solid var(--gray-100)"></div><div class="lbl" style="margin-top:8px">--shadow-lg</div></div><div style="text-align:center"><div style="width:120px;height:68px;background:var(--whatsapp);border-radius:999px;box-shadow:var(--shadow-cta);border:1px solid var(--gray-100)"></div><div class="lbl" style="margin-top:8px">--shadow-cta</div></div></div></body></html>
