<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--text-body);background:#fff}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{width:88px}.sw div{height:60px;border-radius:8px;border:1px solid rgba(0,0,0,.06)}.sw b{display:block;font:600 12px var(--font-sans);margin-top:6px;color:var(--ink-900)}.sw span{font:400 11px ui-monospace,monospace;color:var(--gray-500)}.lbl{font:400 11px ui-monospace,monospace;color:var(--gray-500)}</style></head><body><div class="row"><div class="sw"><div style="background:var(--forest-950)"></div><b>Forest 950</b><span>--forest-950</span></div><div class="sw"><div style="background:var(--forest-800)"></div><b>Forest 800</b><span>--forest-800</span></div><div class="sw"><div style="background:var(--teal-800)"></div><b>Teal 800</b><span>--teal-800</span></div><div class="sw"><div style="background:var(--teal-700)"></div><b>Teal 700</b><span>--teal-700</span></div><div class="sw"><div style="background:var(--teal-500)"></div><b>Teal 500</b><span>--teal-500</span></div><div class="sw"><div style="background:var(--lime-500)"></div><b>Lime 500</b><span>--lime-500</span></div><div class="sw"><div style="background:var(--lime-100)"></div><b>Lime 100</b><span>--lime-100</span></div></div></body></html>
