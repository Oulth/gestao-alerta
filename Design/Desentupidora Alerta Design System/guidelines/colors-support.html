<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;font-family:var(--font-sans);color:var(--text-body);background:#fff}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{width:88px}.sw div{height:60px;border-radius:8px;border:1px solid rgba(0,0,0,.06)}.sw b{display:block;font:600 12px var(--font-sans);margin-top:6px;color:var(--ink-900)}.sw span{font:400 11px ui-monospace,monospace;color:var(--gray-500)}.lbl{font:400 11px ui-monospace,monospace;color:var(--gray-500)}</style></head><body><div class="row"><div class="sw"><div style="background:var(--leaf-600)"></div><b>Leaf 600</b><span>--leaf-600</span></div><div class="sw"><div style="background:var(--leaf-500)"></div><b>Leaf 500</b><span>--leaf-500</span></div><div class="sw"><div style="background:var(--whatsapp)"></div><b>WhatsApp</b><span>--whatsapp</span></div><div class="sw"><div style="background:var(--amber-500)"></div><b>Amber 500</b><span>--amber-500</span></div><div class="sw"><div style="background:var(--lime-400)"></div><b>Lime 400</b><span>--lime-400</span></div><div class="sw"><div style="background:var(--lime-200)"></div><b>Lime 200</b><span>--lime-200</span></div><div class="sw"><div style="background:var(--cream-50)"></div><b>Cream 50</b><span>--cream-50</span></div></div></body></html>
